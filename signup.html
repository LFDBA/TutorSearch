<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tutor Add</title>

        <!--Searchable dropdown styles and script-->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/styles/choices.min.css"
        >
        <script src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>

        <!--Database and signup scripts-->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="signup.js" type="module"></script>

        <!--Minimum styles needed for the availability timeline-->
        <style>
            /*Set the availability popup width*/
            #availability-dialog {
                width: min(48rem, calc(100% - 2rem));
            }

            /*Space the time labels across the timeline*/
            .availability-scale {
                display: flex;
                justify-content: space-between;
            }

            /*Create the clickable 24-hour timeline*/
            .availability-track {
                position: relative;
                height: 4rem;
                border: 1px solid;
                touch-action: none;
                user-select: none;
            }

            /*Display each availability timeframe on the timeline*/
            .availability-timeframe {
                position: absolute;
                top: 0.5rem;
                bottom: 0.5rem;
                box-sizing: border-box;
                overflow: hidden;
                border: 1px solid;
                background: lightgray;
                cursor: grab;
            }

            /*Show which timeframe is selected*/
            .availability-timeframe.is-selected {
                outline: 2px solid;
            }

            /*Keep the timeframe text inside its block*/
            .availability-timeframe-label {
                padding: 0 0.75rem;
                font-size: 0.75rem;
                white-space: nowrap;
                pointer-events: none;
            }

            /*Create draggable resize handles*/
            .availability-resize-handle {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 0.5rem;
                background: gray;
                cursor: ew-resize;
            }

            /*Place the start handle on the left*/
            .availability-resize-handle[data-edge="start"] {
                left: 0;
            }

            /*Place the end handle on the right*/
            .availability-resize-handle[data-edge="end"] {
                right: 0;
            }
        </style>
    </head>
    <body>
        <main>
            <!--Subject selection popup-->
            <dialog id="subjects-dialog" aria-labelledby="subjects-dialog-title">
                <form id="subjects-form" method="dialog" novalidate>
                    <h2 id="subjects-dialog-title">Select subjects</h2>

                    <!--Year group multi-selection-->
                    <fieldset>
                        <legend>Year groups</legend>
                        <div class="year-options">
                            <label><input name="year" type="checkbox" value="9"> Year 9</label>
                            <label><input name="year" type="checkbox" value="10"> Year 10</label>
                            <label><input name="year" type="checkbox" value="11"> Year 11</label>
                            <label><input name="year" type="checkbox" value="12"> Year 12</label>
                            <label><input name="year" type="checkbox" value="13"> Year 13</label>
                        </div>
                    </fieldset>

                    <!--Searchable subject multi-selection-->
                    <div>
                        <label for="subjects">Subjects</label>
                        <p id="subject-help">Select at least one year group first.</p>
                        <select
                            id="subjects"
                            name="subject"
                            multiple
                            required
                            disabled
                            data-placeholder="Search and select subjects"
                            aria-describedby="subject-help"
                        ></select>
                    </div>

                    <!--Subject popup controls-->
                    <div class="dialog-actions">
                        <button value="cancel">Cancel</button>
                        <button id="save-subjects" value="confirm">Done</button>
                    </div>
                </form>
            </dialog>

            <!--Availability selection popup-->
            <dialog id="availability-dialog" aria-labelledby="availability-dialog-title">
                <form id="availability-form" method="dialog">
                    <h2 id="availability-dialog-title">Select availability</h2>

                    <!--Day selection buttons-->
                    <fieldset>
                        <legend>Day</legend>
                        <button type="button" data-availability-day="monday">Monday</button>
                        <button type="button" data-availability-day="tuesday">Tuesday</button>
                        <button type="button" data-availability-day="wednesday">Wednesday</button>
                        <button type="button" data-availability-day="thursday">Thursday</button>
                        <button type="button" data-availability-day="friday">Friday</button>
                        <button type="button" data-availability-day="saturday">Saturday</button>
                        <button type="button" data-availability-day="sunday">Sunday</button>
                    </fieldset>

                    <!--Interactive availability timeline-->
                    <section id="availability-editor" hidden>
                        <h3 id="availability-day-heading"></h3>
                        <!--Timeline labels-->
                        <div class="availability-scale" aria-hidden="true">
                            <span>00:00</span>
                            <span>06:00</span>
                            <span>12:00</span>
                            <span>18:00</span>
                            <span>24:00</span>
                        </div>
                        <!--Timeframes are added to this rectangle with JavaScript-->
                        <div
                            id="availability-track"
                            class="availability-track"
                            aria-describedby="availability-help"
                        ></div>
                        <!--Timeline instructions and exact selected times-->
                        <p id="availability-help" aria-live="polite">
                            Click the timeline to add a one-hour timeframe.
                        </p>
                        <ul id="availability-list"></ul>
                        <button id="remove-timeframe" type="button" disabled>
                            Remove selected timeframe
                        </button>
                    </section>

                    <!--Availability popup controls-->
                    <div>
                        <button value="cancel">Cancel</button>
                        <button value="confirm">Done</button>
                    </div>
                </form>
            </dialog>

            <!--Tutor name input-->
            <label for="name">
                Full name
                <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    maxlength="100"
                    required
                >
            </label>
            <br>

            <!--Tutor email input-->
            <label for="email">
                Email
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >
            </label>
            <br>

            <!--Tutor language input-->
            <label for="languages">
                Languages
                <select id="languages" name="language" multiple required></select>
            </label>
            <br>
            <!--Open the subject popup and show its result-->
            <button id="open-subjects" type="button">Choose subjects</button>
            <p id="subject-summary" aria-live="polite">No subjects selected.</p>
            <!--Open the availability popup and store its result-->
            <button id="open-availability" type="button">Choose availability</button>
            <p id="availability-summary" aria-live="polite">No availability selected.</p>
            <input id="availability-data" name="availability" type="hidden" value="[]">
        </main>
    </body>
</html>
