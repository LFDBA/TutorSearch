<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tutor Add</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/styles/choices.min.css"
        >
        <script src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="supabase-client.js"></script>
        <script src="signup.js" type="module"></script>

    </head>
    <body>
        <main>
            <dialog id="subjects-dialog" aria-labelledby="subjects-dialog-title">
                <form id="subjects-form" method="dialog" novalidate>
                    <h2 id="subjects-dialog-title">Select subjects</h2>

                    <fieldset>
                        <legend>Year groups</legend>
                        <div class="year-options">
                            <label><input name="year" type="checkbox" value="9"> Year 9</label>
                            <label><input name="year" type="checkbox" value="10"> Year 10</label>
                            <label><input name="year" type="checkbox" value="11"> Year 11</label>
                            <label><input name="year" type="checkbox" value="12"> Year 12</label>
                            <label><input name="year" type="checkbox" value="13"> Year 13</label>
                        </div>
                    </fieldset>

                    <div>
                        <label for="subjects">Subjects</label>
                        <p id="subject-help">Select at least one year group first.</p>
                        <select
                            id="subjects"
                            name="subject"
                            multiple
                            required
                            disabled
                            data-placeholder="Search and select subjects"
                            aria-describedby="subject-help"
                        ></select>
                    </div>

                    <div class="dialog-actions">
                        <button value="cancel">Cancel</button>
                        <button id="save-subjects" value="confirm">Done</button>
                    </div>
                </form>
            </dialog>

            <dialog id="availability-dialog" aria-labelledby="availability-dialog-title">
                <form method="dialog">
                    <h2 id="availability-dialog-title">Select availability</h2>
                    <button value="close">Close</button>
                </form>
            </dialog>

            <label for="name">
                Full name
                <input
                    id="name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    maxlength="100"
                    required
                >
            </label>
            <br>

            <label for="languages">
                Languages
                <select id="languages" name="language" multiple required></select>
            </label>
            <br>
            <button id="open-subjects" type="button">Choose subjects</button>
            <p id="subject-summary" aria-live="polite">No subjects selected.</p>
            <button id="open-availability" type="button">Choose availability</button>
        </main>
    </body>
</html>
